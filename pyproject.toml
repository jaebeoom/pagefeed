[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagefeed"
version = "0.1.0"
description = "Generate static RSS feeds from simple webpage listing pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pagefeed = "pagefeed.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
