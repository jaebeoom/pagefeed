name: Update feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Prepare feed config
        env:
          PAGEFEED_CONFIG_TOML: ${{ secrets.PAGEFEED_CONFIG_TOML }}
        run: |
          if [ -n "$PAGEFEED_CONFIG_TOML" ]; then
            mkdir -p .pagefeed
            printf '%s\n' "$PAGEFEED_CONFIG_TOML" > .pagefeed/feeds.toml
            echo "PAGEFEED_CONFIG=.pagefeed/feeds.toml" >> "$GITHUB_ENV"
          elif [ -f feeds.toml ]; then
            echo "PAGEFEED_CONFIG=feeds.toml" >> "$GITHUB_ENV"
          else
            echo "::error::Set the PAGEFEED_CONFIG_TOML repository secret, or commit a feeds.toml file."
            exit 1
          fi

      - name: Generate feeds
        env:
          PYTHONPATH: src
          PAGEFEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PAGEFEED_USER_AGENT: pagefeed/0.1 (+${{ github.server_url }}/${{ github.repository }})
        run: python -m pagefeed generate --config "$PAGEFEED_CONFIG"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs:
      - build
      - deploy
    if: ${{ always() && (needs.build.result == 'failure' || needs.build.result == 'cancelled' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping alert."
            exit 0
          fi

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="pagefeed failed. Check: ${RUN_URL}"
